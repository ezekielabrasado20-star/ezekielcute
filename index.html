<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EZEKIEL ABRASADO</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(to right, #141e30, #243b55);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      margin: 0;
    }

    .content {
      text-align: center;
      margin-top: 100px;
    }

    .name {
      font-size: 40px;
      font-weight: bold;
    }

    /* Bottom Social Icons */
    .social-bottom {
      margin-bottom: 30px;
    }

    .social-bottom a {
      margin: 0 15px;
      font-size: 30px;
      color: white;
      transition: 0.3s;
    }

    .social-bottom a:hover {
      transform: scale(1.4);
    }

    .instagram:hover { color: #E1306C; }
    .twitter:hover { color: #1DA1F2; }
    .linkedin:hover { color: #0077B5; }
    .tiktok:hover { color: #ff0050; }

  </style>
</head>
<body>

  <!-- Name -->
  <div class="content">
    <div class="name">
      <i class="fa-solid fa-user"></i> EZEKIEL ABRASADO
    </div>
  </div>

  <!-- Social Icons Bottom -->
  <div class="social-bottom">
    <a href="#" class="instagram"><i class="fa-brands fa-instagram"></i></a>
    <a href="#" class="twitter"><i class="fa-brands fa-twitter"></i></a>
    <a href="#" class="linkedin"><i class="fa-brands fa-linkedin"></i></a>
    <a href="#" class="tiktok"><i class="fa-brands fa-tiktok"></i></a>
  </div>

</body>
</html>
